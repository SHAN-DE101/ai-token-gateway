replicaCount: 3

image:
  repository: 127.0.0.1:5001/ai-token-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: gateway.ai.enterprise.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  CLICKHOUSE_HOST: "gateway-clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: "ai_gateway"
  REDIS_URL: "redis://gateway-redis:6379/0"
  POSTGRES_URL: "postgresql://gateway_admin:gateway_secret@gateway-postgres:5432/gateway_db"
  OPENAI_API_BASE: "https://api.openai.com/v1"

secrets:
  OPENAI_API_KEY: "prod-upstream-secret-key"
  CLICKHOUSE_PASSWORD: ""

livenessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 3
