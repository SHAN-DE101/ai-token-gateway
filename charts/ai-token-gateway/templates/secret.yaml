apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-token-gateway.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "ai-token-gateway.name" . }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.CLICKHOUSE_PASSWORD | quote }}
