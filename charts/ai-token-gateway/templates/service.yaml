apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-token-gateway.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ai-token-gateway.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ai-token-gateway.name" . }}
