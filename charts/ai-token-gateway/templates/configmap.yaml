apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-token-gateway.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "ai-token-gateway.name" . }}
data:
  CLICKHOUSE_HOST: {{ .Values.env.CLICKHOUSE_HOST | quote }}
  CLICKHOUSE_PORT: {{ .Values.env.CLICKHOUSE_PORT | quote }}
  CLICKHOUSE_DB: {{ .Values.env.CLICKHOUSE_DB | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  POSTGRES_URL: {{ .Values.env.POSTGRES_URL | quote }}
  OPENAI_API_BASE: {{ .Values.env.OPENAI_API_BASE | quote }}
