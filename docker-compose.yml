services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gateway_db
      - POSTGRES_USER=gateway_admin
      - POSTGRES_PASSWORD=gateway_secret
    volumes:
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_admin -d gateway_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.2-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--tcp-backlog", "511"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: gateway-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=ai_gateway
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-core
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://gateway-redis:6379/0
      - CLICKHOUSE_HOST=gateway-clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=ai_gateway
      - POSTGRES_URL=postgresql://gateway_admin:gateway_secret@gateway-postgres:5432/gateway_db
      - OPENAI_API_BASE=http://host.docker.internal:8001/v1
      - OPENAI_API_KEY=mock-prod-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - clickhouse
