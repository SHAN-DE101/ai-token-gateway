[project]
name = "ai-token-gateway"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "httpx[http2]>=0.27.0",
    "redis[hiredis]>=5.0.3",
    "clickhouse-connect>=0.7.6",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "tiktoken>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "locust>=2.24.0"
]
